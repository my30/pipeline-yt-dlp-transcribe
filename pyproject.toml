[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytpipe"
version = "0.1.0"
description = "Interactive YouTube download + local transcription pipeline (yt-dlp + Whisper/FunASR)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# yt-dlp[default] pulls in yt-dlp-ejs, needed (with deno) to solve YouTube's JS challenges.
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "tomli>=2; python_version < '3.11'",  # config.toml on Python 3.10
]

[project.optional-dependencies]
mac = ["mlx-whisper>=0.4", "opencc-python-reimplemented"]
cpu = ["faster-whisper>=1.1", "opencc-python-reimplemented"]
funasr = ["funasr>=1.2", "torch", "torchaudio", "opencc-python-reimplemented"]
dev = ["pytest", "pyyaml"]

[project.urls]
Homepage = "https://github.com/my30/pipeline-yt-dlp-transcribe"

[project.scripts]
ytpipe = "ytpipe.cli:main"

[tool.setuptools]
packages = ["ytpipe"]

[tool.setuptools.package-data]
ytpipe = ["templates/*.md"]
